name: WPT Conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  wpt-conformance:
    name: ${{ matrix.backend.label }}
    strategy:
      fail-fast: false
      matrix:
        backend:
          - id: onnx
            label: ONNX
            continue_on_error: false
            os: ubuntu-latest
          - id: burn-cpu
            label: Burn CPU
            continue_on_error: false
            os: ubuntu-latest
          - id: litert
            label: LiteRT
            continue_on_error: true
            os: ubuntu-latest
          # CoreML runs its trials in parallel (WPT_COREML_TEST_THREADS in the Makefile).
          # Each thread count is its own job so the timings on the hosted runner can be
          # compared in the job summaries; `threads: ''` is libtest's default, one per core.
          - id: coreml
            label: CoreML
            continue_on_error: false
            os: macos-latest
            threads: ''
          - id: coreml
            label: CoreML (1 thread)
            continue_on_error: false
            os: macos-latest
            threads: '1'
          - id: coreml
            label: CoreML (2 threads)
            continue_on_error: false
            os: macos-latest
            threads: '2'
          - id: coreml
            label: CoreML (3 threads)
            continue_on_error: false
            os: macos-latest
            threads: '3'
          - id: coreml
            label: CoreML (4 threads)
            continue_on_error: false
            os: macos-latest
            threads: '4'
          - id: coreml
            label: CoreML (6 threads)
            continue_on_error: false
            os: macos-latest
            threads: '6'
    runs-on: ${{ matrix.backend.os }}
    continue-on-error: ${{ matrix.backend.continue_on_error }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Install protobuf compiler
        if: runner.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: Install protobuf/flatbuffer compiler
        if: runner.os == 'macOS'
        run: |
          brew install protobuf flatbuffers
          protoc --version


      - name: Install flatc
        if: matrix.backend.id == 'litert'
        run: |
          curl -sSL "https://github.com/google/flatbuffers/releases/download/v25.12.19/Linux.flatc.binary.clang++-18.zip" -o /tmp/flatc.zip
          sudo unzip -o /tmp/flatc.zip flatc -d /usr/local/bin
          sudo chmod +x /usr/local/bin/flatc
          flatc --version

      - name: Cache WPT checkout
        uses: actions/cache@v4
        with:
          path: .cache/wpt
          key: wpt-${{ runner.os }}-${{ hashFiles('scripts/fetch_wpt.mjs') }}
          restore-keys: |
            wpt-${{ runner.os }}-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          # Cargo can reuse litert-sys build-script output without downloading
          # its libraries again. Restore both together to keep linker paths valid.
          path: |
            target
            ${{ matrix.backend.id == 'litert' && '~/.cache/litert-sys' || '' }}
          key: ${{ runner.os }}-${{ runner.arch }}-wpt-${{ matrix.backend.id }}-cargo-v2-${{ hashFiles('Cargo.lock') }}
          # A Cargo.lock change restores the previous cache and rebuilds only what changed.
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-wpt-${{ matrix.backend.id }}-cargo-v2-

      - name: Fetch WPT corpus
        run: node scripts/fetch_wpt.mjs

      - name: Run WPT conformance tests
        if: matrix.backend.id != 'burn-cpu'
        env:
          RUSTNN_GIT_SHA: ${{ github.sha }}
          RUSTNN_GIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          # Empty for the non-CoreML backends and for libtest's default thread count.
          WPT_COREML_TEST_THREADS: ${{ matrix.backend.threads }}
        # `shell: bash` enables pipefail, so a failing run is not hidden by tee.
        shell: bash
        run: make test-wpt-report WPT_BACKEND=${{ matrix.backend.id }} 2>&1 | tee wpt-run.log

      - name: Summarize the trial run
        if: always() && matrix.backend.id != 'burn-cpu'
        env:
          WPT_COREML_TEST_THREADS: ${{ matrix.backend.threads }}
        shell: bash
        run: |
          {
            echo "### ${{ matrix.backend.label }}"
            if [ "$RUNNER_OS" = macOS ]; then
              echo "- runner: $(sysctl -n machdep.cpu.brand_string), $(sysctl -n hw.ncpu) logical CPUs, $(uname -m)"
            else
              echo "- runner: $(nproc) logical CPUs, $(uname -m)"
            fi
            if [ "${{ matrix.backend.id }}" = coreml ]; then
              echo "- WPT_COREML_TEST_THREADS: ${WPT_COREML_TEST_THREADS:-(libtest default)}"
            fi
            if [ -f wpt-run.log ]; then
              grep -m1 '^\[WPT\] result:' wpt-run.log | sed 's/^/- /' || echo '- no [WPT] result line (the run did not complete)'
              # The last libtest summary is the WPT run; the tolerance-parity test prints one first.
              grep '^test result:' wpt-run.log | tail -1 | sed 's/^/- libtest: /'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Burn CPU WPT conformance tests
        if: matrix.backend.id == 'burn-cpu'
        env:
          WPT_BACKEND: burn-cpu
          WPT_STRICT_REVISION: '1'
          WPT_REPORT_JSON: reports/wpt-conformance.json
          RUSTNN_GIT_SHA: ${{ github.sha }}
          RUSTNN_GIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          mkdir -p reports
          cargo test --locked --release --features burn-runtime-cpu --test run_wpt_conformance -- --test-threads 1

      - name: Upload WPT conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.backend.id }}${{ matrix.backend.threads && format('-{0}-threads', matrix.backend.threads) || '' }}-wpt-conformance-report
          path: reports/wpt-conformance.json

      - name: Upload WPT conformance HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.backend.id }}${{ matrix.backend.threads && format('-{0}-threads', matrix.backend.threads) || '' }}-wpt-conformance-html-report
          path: reports/wpt-conformance.html


